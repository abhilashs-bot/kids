<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Focus OTP Challenge</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<button id="resetBtn" title="Reset Game">
❌
</button>

<h1>🎯 Focus OTP Challenge</h1>

<p>Watch OTPs carefully and note them down.</p>

<div id="otpBox">------</div>

<div id="timer">Press Start</div>

<button id="startBtn">
Start Game
</button>

<button id="stopBtn" disabled>
Stop Game
</button>

<div id="inputSection" hidden>

<h3>Enter OTPs noted down</h3>

<textarea
id="answers"
rows="8"
placeholder="One OTP per line">
</textarea>

<button id="submitBtn">
Check Score
</button>

</div>

<div id="result"></div>

<div id="historySection" hidden>

<h3>Generated OTPs</h3>

<div id="otpHistory"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
